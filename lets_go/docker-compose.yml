services:
  db:
    image: postgres:18-alpine
    container_name: snippetbox-postgres
    environment:
      POSTGRES_USER: web
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: snippetbox
    ports:
      - "5432:5432"
    volumes:
      - snippetbox-pgdata:/var/lib/postgresql

volumes:
  snippetbox-pgdata:
